<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="resources/css/main.css">
</head>
<body>
    <div class="marco">
        <div class="calculadora">
            <div class="pantalla">
                <input type="text" id="result" disabled>
            </div>
            <div class="arreglo_botones">
                <button data="CalcBtn" class="number">7</button>
                <button data="CalcBtn" class="number">8</button>
                <button data="CalcBtn" class="number">9</button>
                <button data="CalcBtn" class="operator">/</button>
                <button data="CalcBtn" class="number">4</button>
                <button data="CalcBtn" class="number">5</button>
                <button data="CalcBtn" class="number">6</button>
                <button data="CalcBtn" class="operator">x</button>
                <button data="CalcBtn" class="number">1</button>
                <button data="CalcBtn" class="number">2</button>
                <button data="CalcBtn" class="number">3</button>
                <button data="CalcBtn" class="operator">-</button>
                <button data="CalcBtn" class="number">0</button>
                <button data="CalcBtn" class="number">.</button>
                <button data="CalcBtn" class="del">C</button>                
                <button data="CalcBtn" class="operator">+</button>
            </div>
            <div data="CalcBtn" class="arreglo_total">
               <button  class="result">=</button>
            </div>
           
        </div>
        
        <div class="historial">
            <h3>Historial</h3>
            <ul id="lista-historial"></ul>
        </div>
        
    </div>
    
</body>

<footer>Programado por Nestor Ramirez</footer>
</html>
<script src="resources/js/main.js"></script>
